name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-15
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6, verified 2026-10-15
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-19
        with:
          node-version: '24'
      - run: uv sync --locked --group dev
      - run: npm ci --ignore-scripts --no-fund
        working-directory: examples/strong-baseline
      - run: uv audit --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --junitxml artifacts/ci-tests.xml
        env:
          DECISIONGUARD_REQUIRE_STRONG_BASELINE: '1'
      - run: uv run decisionguard demo
      - run: uv run decisionguard benchmark
      - run: uv build
      - run: uv run python scripts/verify_distribution.py dist/decisionguard-0.1.0-py3-none-any.whl --output artifacts/distribution-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-20
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/ci-tests.xml
            artifacts/distribution-check.json
            dist/*
          retention-days: 7
          if-no-files-found: warn
