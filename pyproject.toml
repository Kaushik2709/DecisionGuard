[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decisionguard"
version = "0.1.0"
description = "Local decision consistency and source-bound validation for Git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "mcp>=1.20,<2"]

[project.scripts]
decisionguard = "decisionguard.adapters.cli:main"
decisionguard-mcp = "decisionguard.adapters.mcp:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".cache-clean", ".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/decisionguard/adapters/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

